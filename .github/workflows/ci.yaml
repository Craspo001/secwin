name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        arch: [amd64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          GOOS=${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }} \
          GOARCH=${{ matrix.arch }} \
          go build -ldflags="-s -w" -o bin/secwin_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/secwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secwin-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/secwin_*

  manifest-validation:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build secwin
        run: go build -o bin/secwin ./cmd/secwin
      - name: Validate all manifests
        run: ./bin/secwin manifest validate
      - name: Check manifest schema
        run: |
          for f in manifests/*.yaml; do
            echo "Checking $f..."
            # Basic YAML syntax check
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done

  test-playbooks:
    name: Validate Playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build secwin
        run: go build -o bin/secwin ./cmd/secwin
      - name: Validate playbooks
        run: |
          for f in playbooks/*.yaml; do
            echo "Validating $f..."
            ./bin/secwin playbook validate "$f" || exit 1
          done

  integration-test:
    name: Integration Test
    runs-on: windows-latest
    needs: [build, manifest-validation, test-playbooks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Install core tools (dry-run)
        run: ./bin/secwin_windows_amd64.exe install @core --dry-run
      - name: Run playbook validation
        run: ./bin/secwin_windows_amd64.exe playbook validate playbooks/external-recon.yaml
      - name: Test WSL commands (if available)
        run: |
          if (wsl --version) { ./bin/secwin_windows_amd64.exe wsl list }
        shell: powershell