run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - prealloc
    - noctx
    - nolintlint
    - exhaustive
    - gocritic
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gomnd
    - goprintffuncname
    - gosec
    - gosmopolitan
    - lll
    - maintidx
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - promote
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowsErrCheck
    - sqlclosecheck
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - singleCaseInSwitch
  govet:
    check-shadowing: true
  lll:
    line-length: 120
  misspell:
    locale: US
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: false
  tagliatelle:
    case:
      use-field-name: true
    rules:
      json:
        - snakecase
      yaml:
        - snakecase

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - goconst
    - path: internal/playbook/executor\.go
      linters:
        - gocyclo
    - path: cmd/secwin/commands/
      linters:
        - lll