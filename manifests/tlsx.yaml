name: tlsx
version: "1.1.0"
description: "Fast TLS/SSL scanner for certificate information and misconfiguration detection"
category: vuln-scanning
homepage: "https://github.com/projectdiscovery/tlsx"
repository: "https://github.com/projectdiscovery/tlsx"
license: "MIT"
tags: ["tls", "ssl", "certificate", "scan", "misconfiguration"]
aliases: ["tlsx"]
install_methods:
  - method: binary
    priority: 100
    platforms: [windows, linux, darwin]
    architectures: [amd64, arm64]
    source: "https://github.com/projectdiscovery/tlsx/releases/download/v1.1.0/tlsx_1.1.0_windows_amd64.zip"
    binary_name: "tlsx.exe"
    checksum: "sha256:..."
  - method: github
    priority: 90
    platforms: [windows, linux, darwin]
    architectures: [amd64, arm64]
    source: "projectdiscovery/tlsx"
    version: "v1.1.0"
    extract_path: "tlsx_1.1.0_windows_amd64"
    binary_name: "tlsx.exe"
  - method: wsl
    priority: 80
    platforms: [windows]
    architectures: [amd64, arm64]
    source: "kali-linux"
    version: "1.1.0"
post_install:
  verify_command: "tlsx -version"