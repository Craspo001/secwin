name: plaso
version: "20240401"
description: "Plaso (log2timeline) - Automatic creation of super timelines"
category: forensics
homepage: "https://github.com/log2timeline/plaso"
repository: "https://github.com/log2timeline/plaso"
license: "Apache-2.0"
tags: ["timeline", "log2timeline", "forensics", "super-timeline", "python"]
aliases: ["log2timeline", "plaso"]
wsl_preferred: true
wsl_distro: "kali-linux"
install_methods:
  - method: wsl
    priority: 100
    platforms: [windows]
    architectures: [amd64, arm64]
    source: "kali-linux"
  - method: binary
    priority: 90
    platforms: [windows, linux, darwin]
    architectures: [amd64, arm64]
    source: "https://github.com/log2timeline/plaso/releases/download/20240401/plaso-20240401-windows-x64.zip"
    binary_name: "log2timeline.exe"
    extract_path: "."
  - method: github
    priority: 80
    platforms: [windows, linux, darwin]
    architectures: [amd64, arm64]
    source: "log2timeline/plaso"
    version: "20240401"
    extract_path: "."
    binary_name: "log2timeline.exe"
    pre_commands:
      - "pip install ."
post_install:
  verify_command: "log2timeline.py --version"