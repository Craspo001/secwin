name: autopsy
version: "4.21.0"
description: "Digital forensics platform and graphical interface to The Sleuth Kit"
category: forensics
homepage: "https://www.autopsy.com"
repository: "https://github.com/sleuthkit/autopsy"
license: "Apache-2.0"
tags: ["digital-forensics", "disk-analysis", "file-recovery", "timeline", "sleuthkit"]
wsl_preferred: false
install_methods:
  - method: binary
    priority: 100
    platforms: [windows]
    architectures: [amd64]
    source: "https://github.com/sleuthkit/autopsy/releases/download/autopsy-4.21.0/autopsy-4.21.0-win64.msi"
    binary_name: "autopsy.exe"
    extract_path: "."
  - method: scoop
    priority: 90
    platforms: [windows]
    architectures: [amd64]
    source: "autopsy"
    version: "4.21.0"
  - method: chocolatey
    priority: 80
    platforms: [windows]
    architectures: [amd64]
    source: "autopsy"
    version: "4.21.0"
post_install:
  verify_command: "autopsy --version"